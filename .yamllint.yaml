---
extends: default

rules:
  document-start: disable
  line-length:
    max: 120
    allow-non-breakable-words: true
  truthy:
    # GitHub Actions uses `on:` as a key.
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1

ignore: |
  .cr-release/
